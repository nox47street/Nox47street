<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineVortix - Filmes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#08090d;
    color:white;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,9,13,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #1d1f27;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ff3158;
}

.logo span{
    color:white;
}

.search{
    width:300px;
    background:#15171e;
    border:1px solid #272a34;
    border-radius:10px;
    padding:11px 15px;
    color:white;
    outline:none;
}

.search:focus{
    border-color:#ff3158;
}

/* HERO */
.hero{
    max-width:1200px;
    margin:25px auto;
    padding:50px 30px;
    border-radius:20px;
    background:
    linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.3)),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80")
    center/cover;
}

.hero h1{
    font-size:45px;
    max-width:600px;
    margin-bottom:15px;
}

.hero p{
    color:#ccc;
    max-width:550px;
    line-height:1.6;
}

.hero button{
    margin-top:22px;
    padding:13px 22px;
    border:0;
    border-radius:8px;
    background:#ff3158;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* FILTROS */
.filters{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.filter{
    padding:9px 16px;
    border:1px solid #292c35;
    background:#15171e;
    color:white;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
}

.filter.active,
.filter:hover{
    background:#ff3158;
    border-color:#ff3158;
}

/* CATALOGO */
.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 50px;
}

.title{
    font-size:25px;
    margin-bottom:20px;
}

.movies{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.card{
    background:#111319;
    border:1px solid #20232c;
    border-radius:12px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#ff3158;
}

.poster{
    height:290px;
    width:100%;
    object-fit:cover;
}

.info{
    padding:13px;
}

.info h3{
    font-size:16px;
    margin-bottom:7px;
}

.info p{
    color:#888;
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.watch{
    flex:1;
    border:0;
    background:#ff3158;
    color:white;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
}

.favorite{
    width:40px;
    border:1px solid #333;
    background:#191b22;
    color:white;
    border-radius:7px;
    cursor:pointer;
}

.favorite.active{
    color:#ff3158;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.92);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1000px;
    background:#0e1015;
    border:1px solid #272a32;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:12px;
    z-index:5;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:22px;
    cursor:pointer;
}

.video-container{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.modal-info{
    padding:20px;
}

.modal-info h2{
    margin-bottom:8px;
}

.modal-info p{
    color:#aaa;
}

/* VAZIO */
.empty{
    display:none;
    text-align:center;
    color:#777;
    padding:50px;
}

/* FOOTER */
footer{
    text-align:center;
    color:#666;
    padding:30px;
    border-top:1px solid #1b1d24;
}

/* RESPONSIVO */
@media(max-width:1000px){
    .movies{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:750px){
    .nav{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .hero{
        margin:15px;
        padding:35px 20px;
    }

    .hero h1{
        font-size:32px;
    }

    .movies{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .poster{
        height:240px;
    }
}

@media(max-width:400px){
    .movies{
        grid-template-columns:repeat(2,1fr);
    }

    .poster{
        height:210px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">

        <div class="logo">
            Cine<span>Vortix</span>
        </div>

        <input
            type="text"
            id="search"
            class="search"
            placeholder=" Procurar filme..."
        >

    </div>
</header>

<section class="hero">

    <h1>Seu cinema na palma da mão.</h1>

    <p>
        Explore filmes, encontre seus favoritos e assista
        diretamente pelo seu navegador.
    </p>

    <button onclick="mostrarCatalogo()">
        Explorar filmes
    </button>

</section>

<div class="filters">

    <button class="filter active" onclick="filtrar('Todos',this)">
        Todos
    </button>

    <button class="filter" onclick="filtrar('Ação',this)">
        Ação
    </button>

    <button class="filter" onclick="filtrar('Suspense',this)">
        Suspense
    </button>

    <button class="filter" onclick="filtrar('Animação',this)">
        Animação
    </button>

    <button class="filter" onclick="filtrar('Games',this)">
        Games
    </button>

    <button class="filter" onclick="filtrar('Drama',this)">
        Drama
    </button>

</div>

<main class="container">

    <h2 class="title">Filmes</h2>

    <div id="movies" class="movies"></div>

    <div id="empty" class="empty">
        Nenhum filme encontrado.
    </div>

</main>

<footer>
    © 2026 CineVortix Direitos Reservados
</footer>


<!-- MODAL DO PLAYER -->

<div id="modal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="fecharPlayer()">×</button>

        <div class="video-container">

            <video
                id="player"
                controls
                playsinline
            ></video>

        </div>

        <div class="modal-info">

            <h2 id="modalTitle">Filme</h2>

            <p id="modalDescription">
                Descrição do filme.
            </p>

            <br>

            <button onclick="telaCheia()"
            style="
            background:#ff3158;
            color:white;
            border:0;
            padding:11px 18px;
            border-radius:7px;
            cursor:pointer;">
                ⛶ Tela cheia
            </button>

        </div>

    </div>

</div>


<script>

/*
====================================
 ADICIONE SEUS FILMES AQUI
====================================
*/

const filmes = [

{
    titulo:"Homem Aranha:Um novo dia",
    genero:"Ação",
    ano:"2026",
    poster:"homemaranhaumnovodia.jpg",
    video:"homemaranhaumnovodia.mp4",
    descricao:"Peter Parker enfrenta uma nova ameaça enquanto tenta equilibrar sua vida pessoal e sua missão como Homem-Aranha."
},

{
    titulo:"obsessão",
    genero:"Suspense",
    ano:"2024",
    poster:"obsessão.jpg",
    video:"obsessão.mp4",
    descricao:"Uma pessoa se envolve em uma relação cada vez mais intensa e perigosa, onde nada é o que parece."
},

{
    titulo:"Toy story 5",
    genero:"Animação",
    ano:"2026",
    poster:"toystory5.jpg",
    video:"toystory5.mp4",
    descricao:"Woody, Buzz e seus amigos enfrentam uma nova aventura em um mundo onde a tecnologia ameaça o espaço dos brinquedos."
},

    {
    titulo:"GTA 6",
    genero:"Games",
    ano:"2026",
    poster:"gta6.jpg",
    video:"gta6.mp4",
    descricao:""
},
    
    {
    titulo:"Michael Jackson: Filme",
    genero:"",
    ano:"",
    poster:"michaeljackson.jpg",
    video:".mp4",
    descricao:""
},
    
{
    titulo:"Coringa",
    genero:"Drama",
    ano:"2019",
    poster:"coringa.jpg",
    video:"coringa.mp4",
    descricao:"Arthur Fleck mergulha em uma transformação sombria que o leva a se tornar o lendário Coringa."
},
   
    
    {
    titulo:"Os Simpsons Filme",
    genero:"",
    ano:"",
    poster:"ossimpsons.jpg",
    video:"ossimpsons.mp4",
    descricao:""
},
    
    
    {
    titulo:"Gato de Botas 2",
    genero:"Animação",
    ano:"2019",
    poster:"gatodebotasdois.jpg",
    video:"gatodebotas2.mp4",
    descricao:""
},
    
    
    {
    titulo:"Um Cabra bom de bola",
    genero:"Animação",
    ano:"2026",
    poster:"umcabrabomdebola.jpg",
    video:"umcabrabomdebola.mp4",
    descricao:""
},
    
{
    titulo:"Irmão Urso",
    genero:"Animação",
    ano:"2003",
    poster:"irmãourso.jpg",
    video:"irmãourso.mp4",
    descricao:"Um jovem transformado em urso aprende sobre responsabilidade, família e amor durante sua jornada."
},

{
    titulo:"Homem Aranha no Aranhaverso",
    genero:"Animação",
    ano:"2018",
    poster:"homemaranhanoaranhaverso.jpg",
    video:"homemaranhanoaranhaverso.mp4",
    descricao:"Miles Morales descobre um universo de diferentes Homens-Aranha e precisa aprender a assumir seu próprio destino."
}

];

let categoriaAtual = "Todos";


/* RENDERIZAR FILMES */

function renderizar(){

    const area = document.getElementById("movies");

    const busca =
        document.getElementById("search").value.toLowerCase();

    area.innerHTML = "";

    const resultado = filmes.filter(filme => {

        const categoria =
            categoriaAtual === "Todos" ||
            filme.genero === categoriaAtual;

        const pesquisa =
            filme.titulo.toLowerCase().includes(busca);

        return categoria && pesquisa;

    });

    document.getElementById("empty").style.display =
        resultado.length ? "none" : "block";


    resultado.forEach((filme,index)=>{

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img
                class="poster"
                src="${filme.poster}"
                alt="${filme.titulo}"
            >

            <div class="info">

                <h3>${filme.titulo}</h3>

                <p>
                    ${filme.genero} • ${filme.ano}
                </p>

                <div class="actions">

                    <button
                        class="watch"
                        onclick="abrirPlayer(${index})">
                        ▶ Assistir
                    </button>

                    <button
                        class="favorite"
                        onclick="favoritar(this)">
                        ♡
                    </button>

                </div>

            </div>
        `;

        area.appendChild(card);

    });

}


/* PESQUISA */

document
.getElementById("search")
.addEventListener("input",renderizar);


/* FILTRO */

function filtrar(categoria,botao){

    categoriaAtual = categoria;

    document
    .querySelectorAll(".filter")
    .forEach(b => b.classList.remove("active"));

    botao.classList.add("active");

    renderizar();

}


/* PLAYER */

function abrirPlayer(index){

    const filme = filmes[index];

    document.getElementById("modalTitle").textContent =
        filme.titulo;

    document.getElementById("modalDescription").textContent =
        filme.descricao;

    const player =
        document.getElementById("player");

    player.src = filme.video;

    document.getElementById("modal").style.display =
        "flex";

    player.play().catch(()=>{});

}


function fecharPlayer(){

    const player =
        document.getElementById("player");

    player.pause();

    player.src = "";

    document.getElementById("modal").style.display =
        "none";

}


/* TELA CHEIA */

function telaCheia(){

    const video =
        document.getElementById("player");

    if(video.requestFullscreen){

        video.requestFullscreen();

    }else if(video.webkitRequestFullscreen){

        video.webkitRequestFullscreen();

    }else if(video.webkitEnterFullscreen){

        video.webkitEnterFullscreen();

    }

}


/* FAVORITOS */

function favoritar(botao){

    botao.classList.toggle("active");

    botao.textContent =
        botao.classList.contains("active")
        ? "♥"
        : "♡";

}


/* BOTÃO HERO */

function mostrarCatalogo(){

    document
    .getElementById("movies")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* ESC PARA FECHAR */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        fecharPlayer();

    }

});


/* INICIAR */

renderizar();

</script>

</body>
</html>
